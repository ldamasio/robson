[package]
name = "robsond"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
postgres = ["robson-store/postgres", "sqlx"]
# Test harness only (ADR-0056 step 7): never in a production build.
crash-points = ["robson-exec/crash-points", "robson-connectors/crash-points"]

[[bin]]
name = "robsond"
path = "src/main.rs"

[dependencies]
robson-domain = { path = "../robson-domain" }
robson-engine = { path = "../robson-engine" }
robson-exec = { path = "../robson-exec" }
robson-connectors = { path = "../robson-connectors" }
robson-store = { path = "../robson-store" }
robson-eventlog = { path = "../robson-eventlog" }
robson-projector = { path = "../robson-projector" }
robson-db = { path = "../robson-db" }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { version = "0.7" }
axum = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
prometheus = { workspace = true }
# `_exit` for the stop's hard bound (ADR-0056 step 7).
libc = "0.2"

[dev-dependencies]
proptest = "1"
# Paused time for the stop's timing tests (ADR-0056 step 7).
tokio = { workspace = true, features = ["test-util"] }
rust_decimal_macros = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
http-body-util = "0.1"
robson-eventlog = { path = "../robson-eventlog" }
robson-projector = { path = "../robson-projector" }
robson-domain = { path = "../robson-domain" }
robson-engine = { path = "../robson-engine" }
robson-exec = { path = "../robson-exec" }
robson-store = { path = "../robson-store" }
robson-testkit = { path = "../robson-testkit" }
anyhow = { workspace = true }
