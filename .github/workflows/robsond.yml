name: Robsond CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/robsond.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "clippy.toml"
      - "migrations/**"
      - "robson-*/**"
      - "robsond/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  # No paths filter here, unlike push, so Rust Tests can be a required check on
  # main: a workflow skipped by a filter reports nothing, and a PR touching none
  # of the paths above would wait for the check forever. push keeps its filter
  # because a run on main deploys: a docs merge must not restart the daemon.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege (RBX guardrails): neither job writes to this repository
# with GITHUB_TOKEN. The image push and the rbx-infra pin bump use the
# GITOPS_TOKEN PAT; actions/cache uses the runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

# On main no run cancels another. With one group per ref, a run that started
# late or a re-run of an old one cancelled the newer run in progress. Each main
# commit now gets its own group, and the promotion guard in build-and-push
# decides which run moves the pin. Elsewhere a new run still cancels the old.
concurrency:
  group: robsond-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/rbxrobotica/robson-v2

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    # libtest has no per-test limit and only warns after 60 s, so a hung test
    # would hold the runner until GitHub's 6 h default. The job takes 3 to 8
    # minutes (2026-11-07), so 20 leaves room for a slow runner.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robson_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Rust toolchain and deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: the feature-enabled test artifacts added by the DATABASE_URL
          # step would otherwise never land in an existing, immutable exact-hit
          # cache keyed on Cargo.lock alone.
          key: rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/robsond.yml') }}
          restore-keys: rust-v2-${{ runner.os }}-

      - name: Assert the Dockerfile builds with the pinned toolchain
        # The production image must be compiled with the same rustc that CI
        # tests. rust-toolchain.toml is the single source of truth; the
        # Dockerfile pins the matching docker.io/library/rust image by digest.
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          have=$(sed -n 's|^FROM docker.io/library/rust:\([0-9.]*\)-slim-bookworm@sha256:[0-9a-f]\{64\} AS builder$|\1|p' Dockerfile)
          echo "rust-toolchain.toml=$want Dockerfile=$have"
          test -n "$have" || { echo '::error::Dockerfile builder image is not pinned as rust:<ver>-slim-bookworm@sha256:<digest>'; exit 1; }
          test "$want" = "$have" || { echo "::error::Dockerfile rust $have != rust-toolchain.toml $want"; exit 1; }

      - name: Run tests (no postgres feature - uses MemoryStore)
        run: cargo test --all --no-fail-fast

      # The image ships with this feature (see Dockerfile). A test it gates
      # without #[ignore] runs nowhere else: the step above compiles it out and
      # the DATABASE_URL step below selects only --ignored tests. DATABASE_URL
      # stays unset here on purpose: these tests need no database, and
      # Config::from_env requires PROJECTION_TENANT_ID once it is set, which
      # fails the config tests. robson-connectors has no such tests.
      - name: Run tests with the postgres feature (no database)
        run: cargo test --workspace --exclude robson-connectors --features postgres --no-fail-fast

      - name: Reject duplicate migration versions
        # SQLx identifies migrations solely by the numeric prefix; two files
        # sharing one version fail at runtime with VersionMismatch. Catch it
        # before PostgreSQL ever sees them.
        run: |
          dups=$(ls migrations/*.sql | sed 's|.*/||; s|_.*||; s|^0*||' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate migration version prefix(es): $dups"
            exit 1
          fi

      - name: Validate SQLx migrations on clean PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robson_migration_ci
        run: cargo run -p robsond --features postgres -- db migrate

      # 68 tests marked #[ignore] need a real PostgreSQL (store, projector,
      # robson-db, crash recovery, income ledger, replay, trailing stop e2e,
      # daemon internals). They were never run in CI (2026-10-30 assessment).
      # Each uses #[sqlx::test(migrations = "../migrations")]: SQLx creates a
      # fresh database per test on this service, migrates it and drops it, so
      # tests are isolated and only need DATABASE_URL to reach the server.
      # robson-connectors' four ignored tests are live Binance REST smoke tests
      # and stay local: Binance refuses requests from GitHub-hosted (US) runners.
      - name: Run the DATABASE_URL-gated tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robson_migration_ci
        # The canonical script runs them in two phases: the migration38 suite
        # (bounded_migration::public_pg::) one test at a time, everything else
        # with the default concurrency.
        run: bash scripts/test-pg.sh

      # Crash harness (ADR-0056 step 7): the crash-points feature must never
      # reach a release build. robson-exec carries the compile_error!.
      - name: Reject the crash-points feature in a release build
        timeout-minutes: 5
        run: |
          if out=$(cargo check --release -p robson-exec --features crash-points 2>&1); then
            echo "::error::crash-points compiled in a release build"
            exit 1
          fi
          grep -F "must never be combined with a release build" <<<"$out"
          # Inverted on purpose: a forward tree never lists the root package's
          # feature edges, so it would pass even with the feature on. Captured
          # first, so a failing cargo tree fails this step instead of reading
          # as "no match".
          tree=$(cargo tree -p robsond --features postgres -e features,normal -i robson-exec)
          test -n "$tree"
          if grep -q crash-points <<<"$tree"; then
            echo "::error::the production feature set enables crash-points"
            exit 1
          fi

      # Real robsond killed at named crash points, against the fake venue and
      # the database proxy (robson-testkit). DATABASE_URL points at the postgres
      # service above; each test gets a sqlx::test database, nothing is spawned
      # here. timeout-minutes bounds the step; the child watchdogs in
      # DaemonProcess bound each robsond, so a stuck child cannot hold the run.
      - name: Run the crash harness
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robson_migration_ci
        run: cargo test -p robsond --features postgres,crash-points --test crash_harness --no-fail-fast -- --include-ignored --test-threads=2

      # robson-testkit (fakes, stubs, the conformance suite) is test support:
      # only dev-dependency edges may reach it, under any target or feature
      # (ADR-0056 step 8, 8d plan §5.4). The earlier steps run cargo unlocked,
      # so the lockfile is first compared with the commit; every target's
      # packages are then fetched, because an unfiltered cargo metadata
      # resolves them all; check-dev-only refuses empty or malformed input.
      - name: Assert robson-testkit is reached by dev-dependencies only
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- Cargo.lock
          cargo fetch --locked
          cargo metadata --offline --locked --format-version 1 | cargo run --locked -p robson-testkit --bin check-dev-only

      # Pinned, not rolling. rustfmt.toml enables unstable options
      # (wrap_comments, comment_width, normalize_comments,
      # format_code_in_doc_comments, imports_granularity, group_imports), whose
      # output is not stable across nightlies. With a rolling `nightly`, a
      # toolchain change reformats files no PR touched, and every Rust PR turns
      # red at once while main's last green run stays green because it ran on
      # an older nightly. That happened on 2026-09-04: comment reflow in
      # robson-domain/src/{entities,events,value_objects}.rs failed #186, a PR
      # that touches none of them.
      #
      # Bumping this pin is a deliberate step: install the new nightly, run
      # `cargo +nightly-<date> fmt --all` and commit the reformat in its own PR.
      - name: Install nightly toolchain (for rustfmt)
        run: rustup toolchain install nightly-2026-08-22 --component rustfmt

      - name: Check formatting (nightly rustfmt for unstable options)
        run: cargo +nightly-2026-08-22 fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # One promotion at a time across main commits, so the pin and latest move
    # together. queue: max keeps every waiting job (the default would replace
    # the pending one, letting a late run cancel a newer one); the guard skips
    # whichever waited behind a newer commit.
    concurrency:
      group: robsond-promote
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # scripts/promotion-guard.sh compares this commit with the pinned
          # one, which needs main's history, not only this commit.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ldamasio
          password: ${{ secrets.GITOPS_TOKEN }}

      - name: Compute SHA tag
        id: meta
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `latest` is intentionally not moved here; the deployment pin is
          # proposed for human review in a separate repository.
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          no-cache: false

      - name: Propose image pin in rbx-infra
        id: pin
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/rbxrobotica/rbx-infra.git /tmp/rbx-infra
          cd /tmp/rbx-infra

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pattern R (rbx-infra docs/infra/IMAGE-PROMOTION.md): the single
          # pin for every robson-v2 image lives in the overlay's images
          # transformer. The Deployment and migrate Job carry a
          # `sha-REPLACE_ME` placeholder on purpose (rbx-infra #206), so
          # editing them is a no-op for the cluster and corrupts the
          # placeholder; bump the kustomize pin instead.
          K=apps/prod/robson/kustomization.yml
          PIN='.images[] | select(.name == "ghcr.io/rbxrobotica/robson-v2") | .newTag'

          branch="image-promotion/robson-v2/${SHA_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"

          PINNED=$(yq "$PIN" "$K")
          git -C "$GITHUB_WORKSPACE" fetch --quiet --no-tags origin main
          TIP=$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)
          VERDICT=$(cd "$GITHUB_WORKSPACE" && bash scripts/promotion-guard.sh "$SHA" "$PINNED" "$TIP")
          echo "$VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "${VERDICT%%:*}" != promote ]; then
            echo "::notice title=Promotion not proposed::$VERDICT"
            exit 0
          fi

          yq -i "($PIN) = \"${SHA_TAG}\"" "$K"
          grep -q "newTag: ${SHA_TAG}$" "$K" || {
            echo "::error::kustomize pin was not updated in $K"
            exit 1
          }
          git add "$K"

          if git diff --staged --quiet; then
            echo "No promotion proposal needed (already at ${SHA_TAG})"
            exit 0
          fi

          git commit -m "chore(robson-v2): propose image ${SHA_TAG}" \
            -m "Automated promotion proposal by the Robson v2 pipeline." \
            -m "Triggered by: ${REPO}@${SHA}" \
            -m "[skip ci]"

          git push --set-upstream origin "$branch"

          body_file="${RUNNER_TEMP}/robson-promotion.md"
          {
            echo "Automated immutable-image promotion proposal."
            echo
            echo "- Image: ghcr.io/rbxrobotica/robson-v2:${SHA_TAG}"
            echo "- Source: ${REPO}@${SHA}"
            echo "- Deployment: none; review and merge remain human-gated."
            echo "- Identity rollout: verify the matching RBX Identity/ZITADEL and tenant configuration before approval."
          } > "$body_file"

          GH_TOKEN="$GITOPS_TOKEN" gh pr create \
            --repo rbxrobotica/rbx-infra \
            --base main \
            --head "$branch" \
            --title "chore(robson-v2): propose ${SHA_TAG}" \
            --body-file "$body_file"

      - name: Summary
        if: always()
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          BUILD: ${{ steps.build.outcome }}
          PIN_STEP: ${{ steps.pin.outcome }}
          VERDICT: ${{ steps.pin.outputs.verdict }}
        run: |
          if [ -n "$VERDICT" ]; then
            PIN_ROW="proposal result: $VERDICT"
          elif [ "$PIN_STEP" = success ]; then
            PIN_ROW="human-gated PR proposed"
          else
            PIN_ROW="not proposed (step: $PIN_STEP)"
          fi
          echo "## Robson v2 CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}\` (push: $BUILD) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Production pin | $PIN_ROW |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | none; review and merge remain human-gated |" >> $GITHUB_STEP_SUMMARY
