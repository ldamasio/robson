name: Robsond CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/robsond.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "clippy.toml"
      - "migrations/**"
      - "robson-*/**"
      - "robsond/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".dockerignore"
      - ".github/workflows/robsond.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "clippy.toml"
      - "migrations/**"
      - "robson-*/**"
      - "robsond/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robsond-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rbxrobotica/robson-v2

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robson_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust toolchain and deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: the feature-enabled test artifacts added by the DATABASE_URL
          # step would otherwise never land in an existing, immutable exact-hit
          # cache keyed on Cargo.lock alone.
          key: rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/robsond.yml') }}
          restore-keys: rust-v2-${{ runner.os }}-

      - name: Assert the Dockerfile builds with the pinned toolchain
        # The production image must be compiled with the same rustc that CI
        # tests. rust-toolchain.toml is the single source of truth; the
        # Dockerfile pins the matching docker.io/library/rust image by digest.
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          have=$(sed -n 's|^FROM docker.io/library/rust:\([0-9.]*\)-slim-bookworm@sha256:[0-9a-f]\{64\} AS builder$|\1|p' Dockerfile)
          echo "rust-toolchain.toml=$want Dockerfile=$have"
          test -n "$have" || { echo '::error::Dockerfile builder image is not pinned as rust:<ver>-slim-bookworm@sha256:<digest>'; exit 1; }
          test "$want" = "$have" || { echo "::error::Dockerfile rust $have != rust-toolchain.toml $want"; exit 1; }

      - name: Run tests (no postgres feature - uses MemoryStore)
        run: cargo test --all --no-fail-fast

      - name: Reject duplicate migration versions
        # SQLx identifies migrations solely by the numeric prefix; two files
        # sharing one version fail at runtime with VersionMismatch. Catch it
        # before PostgreSQL ever sees them.
        run: |
          dups=$(ls migrations/*.sql | sed 's|.*/||; s|_.*||; s|^0*||' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate migration version prefix(es): $dups"
            exit 1
          fi

      - name: Validate SQLx migrations on clean PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robson_migration_ci
        run: cargo run -p robsond --features postgres -- db migrate

      # 68 tests marked #[ignore] need a real PostgreSQL (store, projector,
      # robson-db, crash recovery, income ledger, replay, trailing stop e2e,
      # daemon internals). They were never run in CI (2026-10-30 assessment).
      # Each uses #[sqlx::test(migrations = "../migrations")]: SQLx creates a
      # fresh database per test on this service, migrates it and drops it, so
      # tests are isolated and only need DATABASE_URL to reach the server.
      # robson-connectors' four ignored tests are live Binance REST smoke tests
      # and stay local: Binance refuses requests from GitHub-hosted (US) runners.
      - name: Run the DATABASE_URL-gated tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robson_migration_ci
        run: cargo test --workspace --exclude robson-connectors --features postgres --no-fail-fast -- --ignored

      # Pinned, not rolling. rustfmt.toml enables unstable options
      # (wrap_comments, comment_width, normalize_comments,
      # format_code_in_doc_comments, imports_granularity, group_imports), whose
      # output is not stable across nightlies. With a rolling `nightly`, a
      # toolchain change reformats files no PR touched, and every Rust PR turns
      # red at once while main's last green run stays green because it ran on
      # an older nightly. That happened on 2026-09-04: comment reflow in
      # robson-domain/src/{entities,events,value_objects}.rs failed #186, a PR
      # that touches none of them.
      #
      # Bumping this pin is a deliberate step: install the new nightly, run
      # `cargo +nightly-<date> fmt --all` and commit the reformat in its own PR.
      - name: Install nightly toolchain (for rustfmt)
        run: rustup toolchain install nightly-2026-08-22 --component rustfmt

      - name: Check formatting (nightly rustfmt for unstable options)
        run: cargo +nightly-2026-08-22 fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ldamasio
          password: ${{ secrets.GITOPS_TOKEN }}

      - name: Compute SHA tag
        id: meta
        run: echo "sha_tag=sha-$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          no-cache: false

      - name: Update image tags in rbx-infra
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/rbxrobotica/rbx-infra.git /tmp/rbx-infra
          cd /tmp/rbx-infra

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pattern R (rbx-infra docs/infra/IMAGE-PROMOTION.md): the single
          # pin for every robson-v2 image lives in the overlay's images
          # transformer. The Deployment and migrate Job carry a
          # `sha-REPLACE_ME` placeholder on purpose (rbx-infra #206), so
          # editing them is a no-op for the cluster and corrupts the
          # placeholder; bump the kustomize pin instead.
          K=apps/prod/robson/kustomization.yml
          yq -i "(.images[] | select(.name == \"ghcr.io/rbxrobotica/robson-v2\") | .newTag) = \"${SHA_TAG}\"" "$K"
          grep -q "newTag: ${SHA_TAG}$" "$K" || { echo "::error::kustomize pin was not updated in $K"; exit 1; }

          git add "$K"

          if git diff --staged --quiet; then
            echo "No manifest changes needed (already at ${SHA_TAG})"
            exit 0
          fi

          git commit -m "chore(robson-v2): update image tag to ${SHA_TAG}" \
            -m "Automated update by Robson v2 CI/CD pipeline." \
            -m "Triggered by: ${REPO}@${SHA}" \
            -m "[skip ci]"

          for i in 1 2 3; do
            if git push origin main; then
              echo "Manifests pushed - ArgoCD will auto-sync"
              exit 0
            fi
            echo "Push attempt $i failed, rebasing..."
            git pull --rebase origin main
          done

          echo "::error::Failed to push to rbx-infra after 3 attempts"
          exit 1

      - name: Summary
        run: |
          echo "## Robson v2 Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will auto-sync when rbx-infra manifest is updated." >> $GITHUB_STEP_SUMMARY
