name: Engineering Guardrails

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks
        # Checksum from the release's gitleaks_8.30.1_checksums.txt; a tampered
        # or truncated download fails here instead of scanning with it.
        run: |
          curl -sSfL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Scans the working tree (--no-git), not git history: the history
      # carries known pre-guardrails findings (2026-07-05 audit); their
      # remediation is tracked separately. This gate stops NEW secrets.
      - name: Run gitleaks
        run: ./gitleaks detect --source . --no-git --no-banner --redact

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install osv-scanner
        run: |
          url="https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors -o osv-scanner "$url"; then
              # Checksum from the release's osv-scanner_SHA256SUMS.
              echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  osv-scanner" | sha256sum -c -
              chmod +x osv-scanner
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # --config is explicit: osv-scanner only auto-loads osv-scanner.toml from
      # the directory of each scanned lockfile, so without it the root file would
      # not apply to frontend/pnpm-lock.yaml.
      - name: Run osv-scanner
        run: ./osv-scanner scan source --config osv-scanner.toml --lockfile Cargo.lock --lockfile frontend/pnpm-lock.yaml --lockfile scripts/requirements-security.txt

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
