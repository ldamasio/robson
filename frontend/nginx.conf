server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health endpoint for k8s probes
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Long cache for versioned assets (Vite hashes in filenames)
  #
  # NOTE: nginx does not merge `add_header` across levels — a location
  # that declares its own `add_header` (like the Cache-Control below)
  # stops inheriting the server block's `add_header`s entirely, it does
  # not just add to them. So the security headers below are repeated
  # here (and in `= /index.html`) on purpose; without this, those
  # responses would silently ship with none of the server-level headers.
  location /_app/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri =404;
  }

  # Short cache for HTML (always fetch latest)
  # See the location-level `add_header` note above — this is where `/`
  # actually ends up being served from (via the try_files fallback in
  # `location /` below), so this block needs the security headers too.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes land on index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # ADR-0054: Google Identity Services' popup sign-in flow needs the
  # opener (this page) to keep window.opener/postMessage access to the
  # accounts.google.com popup it opens. The browser's default
  # cross-origin-isolation posture (or an explicit `same-origin` COOP)
  # severs that, breaking the credential handoff after Google login
  # succeeds. `same-origin-allow-popups` is Google's own documented fix:
  # keeps isolation from other cross-origin *embeds* while explicitly
  # permitting the *popup* relationship GIS relies on.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/javascript application/json
            image/svg+xml font/woff2 font/woff;
  gzip_min_length 1024;
  gzip_comp_level 6;
}
