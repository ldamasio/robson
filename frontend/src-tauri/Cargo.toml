[package]
name = "robson-mobile"
version = "0.1.0"
description = "RBX Robson Tauri client"
authors = ["RBX Robotics"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "robson_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
futures-util = "=0.3.31"
rand = "=0.9.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "rustls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-opener = "=2.5.5"
tokio = { version = "=1.49.0", features = ["macros", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
