# osv-scanner exceptions (guardrails CI — AGENTS.md invariant 14).
#
# Every entry here is a documented, dated exception for a finding with NO
# fixed release on our dependency path. Never add an entry for a finding
# that has a fix — update the dependency instead. Re-audit on each entry's
# stated condition.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa (Marvin timing attack): no fixed release exists. Two inclusion paths as of 2026-09-11: (1) sqlx's optional sqlx-mysql — robson enables postgres only, so unused there; (2) jsonwebtoken's rust_crypto feature (ADR-0054, RS256 Google ID token verification in robsond), which IS compiled and actively used. The Marvin attack leaks the *private* key via timing sidechannels in PKCS#1v1.5 decryption/signing (see the advisory: 'information about the private key is leaked'); robsond only ever performs RS256 *verification* with a *public* key built from Google's published JWKS (robsond/src/auth.rs, robsond/src/google_jwks.rs) and never holds or uses an RSA private key, so this attack's precondition (attacker-observable timing over private-key-dependent computation) does not apply to that path either. Re-evaluate when rsa ships a fix, sqlx drops the optional edge, or jsonwebtoken's usage here changes to include private-key operations. (2026-09-11)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0437"
reason = "protobuf 2.x (recursion crash in parsing): fix requires protobuf 3.x, a semver-major only consumable when prometheus updates its dependency. Exposure is limited to the /metrics exposition path, which is cluster-internal. Re-evaluate on prometheus crate releases. (2026-07-05)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0235"
reason = "rkyv 0.7 (validation bypass): fix is rkyv 0.8.17, a semver-major only consumable when rust_decimal updates its optional dependency edge (still 0.7 as of rust_decimal 1.42). rkyv is an unenabled optional feature of rust_decimal — it is never compiled into any robson binary (cargo tree -i rkyv is empty on every target). Re-evaluate on rust_decimal releases. (2026-08-04)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 (timing variability in constant-time ops): fix is 0.7.6, a semver-major reachable only when jsonwebtoken moves from p256 0.13 / elliptic-curve 0.13 to the 0.14 RustCrypto line. Inclusion path: jsonwebtoken rust_crypto -> p256 -> elliptic-curve -> crypto-bigint, i.e. ES256 support that robsond never exercises: the verifier is pinned to Algorithm::RS256 (robsond/src/auth.rs) for Google ID tokens built from the public JWKS. The advisory concerns secret-dependent arithmetic (private keys, signing, inversion of secrets); robsond holds no private key and performs no ECDSA operation at all. Re-evaluate when jsonwebtoken updates its p256/elliptic-curve edge. (2026-10-28)"

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10.4 (caught panic inside a digest compress callback leaves the inline cursor corrupted, enabling OOB access afterwards): fix is 0.12.1, reachable only through digest/sha2 0.11, a semver-major across the RustCrypto tree pulled by sqlx, reqwest/rustls and jsonwebtoken. Precondition: catching a panic raised from within a hash compress callback and then reusing the same buffer. robsond never wraps hashing in catch_unwind; a panic there propagates and the task/process ends (panic = abort for the daemon's purposes), so the corrupted-buffer state is never observed. Re-evaluate when the dependency tree moves to digest 0.11. No RUSTSEC id yet, hence absent from .cargo/audit.toml. (2026-10-28)"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
reason = "libsqlite3-sys 0.30.1 (bundled SQLite < 3.54.0 can return uninitialized page-cache memory when opening a crafted database with a sibling -wal file of a different page size): fix is 0.39.0, and no sqlx release accepts it — sqlx-sqlite 0.8.0 requires ^0.28.0, 0.8.1–0.8.6 require ^0.30.1 and 0.9.0 requires >=0.30.1, <0.38.0. Inclusion path: sqlx's optional sqlx-sqlite (listed by sqlx and sqlx-macros-core), which robson never enables — every crate uses sqlx with postgres only, so cargo tree -i libsqlite3-sys and -i sqlx-sqlite are empty on every target with --all-features, and no robson code opens a SQLite file. Re-evaluate when an sqlx release accepts libsqlite3-sys >= 0.39 or when any path compiles SQLite (sqlx's sqlite, sqlite-unbundled or all-databases features, or a new dependency or tool); remove this entry if sqlx drops the lockfile edge. (2026-11-09)"

