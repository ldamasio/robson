reason = "minimatch 3.1.5 (globparts amplification DoS with attacker-supplied patterns at optimizationLevel >= 2): the only fixed release is 11.0.1, a semver-major reachable only when eslint and @eslint/config-array/@eslint/eslintrc move off their ^3 edges (eslint 10 still pins ^10.2.6, also unfixed). Precondition absent: minimatch is pulled solely by eslint, a dev-only tool that is not part of the CI gates or the production image, and the only patterns it sees are the repository's own eslint config globs. Re-evaluate on eslint releases that bump minimatch to >= 11.0.1. (2026-11-03)"
