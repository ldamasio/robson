id = "GHSA-27mw-82g8-phjj"
reason = "@sveltejs/kit < 3.0.0 (unescaped cache-control value in a prerendered <meta http-equiv> tag): fix is SvelteKit 3.0.0, a semver-major that requires Vite 8 (rolldown), @sveltejs/vite-plugin-svelte 7, TypeScript 6 and Node >= 22.17, while the production image (frontend/Dockerfile) and CI run Node 20 — a deliberate migration PR, not a bump. Precondition absent: the trigger is setHeaders({'cache-control': <untrusted>}) at prerender time; the frontend never calls setHeaders (grep setHeaders src/ is empty) and prerenders only its own static shell (ssr=false, prerender=true in src/routes/+layout.ts) with no request-derived input. Re-evaluate when the SvelteKit 3 migration lands. (2026-11-03)"

